<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District - Movies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar bg-white border-bottom">
    <div class="container-fluid px-4">

        <div class="d-flex align-items-center gap-3">
            <div class="logo-box text-center">
                <div class="logo">district</div>
                <div class="logo-small">BY ZOMATO</div>
            </div>

            <div class="divider"></div>

            <div class="d-flex align-items-center gap-2">
                <div class="location-icon">♢</div>
                <div>
                    <div class="location-name">Gurugram</div>
                    <div class="location-state">Haryana</div>
                </div>
            </div>
        </div>

        <nav class="navbar-nav flex-row gap-1 ms-5">
            <a class="nav-link active" href="#">For you</a>
            <a class="nav-link" href="#">Dining</a>
            <a class="nav-link" href="#">Movies</a>
            <a class="nav-link" href="#">Events</a>
            <a class="nav-link" href="#">Comedy</a>
            <a class="nav-link" href="#">Stores</a>
            <a class="nav-link" href="#">Activities</a>
            <a class="nav-link" href="#">Play</a>
        </nav>

        <button class="btn booking-status ms-auto">
            ✓ Booking Confirmed
        </button>

    </div>
</header>


<main class="container py-4">

    <h2 class="heading mb-4">
        Top Hindi movies near you
    </h2>

    <div class="row g-3">

        <div class="col-lg-3">
            <div class="card movie-card h-100">

                <img src="https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg"
                    class="card-img-top movie-image"
                    alt="Hanuman Ansh">

                <div class="card-body">
                    <h5 class="card-title">Hanuman Ansh</h5>
                    <p class="card-text">U | Hindi</p>

                    <div class="rating">
                        <span class="star">★</span> 9.0
                    </div>

                    <button class="btn book-btn">Book Now</button>
                </div>

            </div>
        </div>


        <div class="col-lg-3">
            <div class="card movie-card h-100">

                <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg"
                    class="card-img-top movie-image"
                    alt="Mirzapur">

                <div class="card-body">
                    <h5 class="card-title">Mirzapur: The Movie</h5>
                    <p class="card-text">A | Hindi</p>

                    <div class="rating">
                        <span class="star">★</span> 8.5
                    </div>

                    <button class="btn book-btn">Book Now</button>
                </div>

            </div>
        </div>


        <div class="col-lg-3">
            <div class="card movie-card h-100">

                <img src="https://cdn.district.in/movies-assets/images/cinema/toxiv%3Dc-8340c900-9c6f-11f1-97d4-73a32236137e.jpg"
                    class="card-img-top movie-image"
                    alt="Toxic">

                <div class="card-body">
                    <h5 class="card-title">Toxic</h5>
                    <p class="card-text">U | Hindi</p>

                    <div class="rating">
                        <span class="star">★</span> 8.8
                    </div>

                    <button class="btn book-btn">Book Now</button>
                </div>

            </div>
        </div>


        <div class="col-lg-3">
            <div class="card movie-card h-100">

                <img src="https://cdn.district.in/movies-assets/images/cinema/AW_Poster-18591030-9548-11f1-b29d-8985d3d6c644.jpg"
                    class="card-img-top movie-image"
                    alt="Awarapan 2">

                <div class="card-body">
                    <h5 class="card-title">Awarapan 2</h5>
                    <p class="card-text">U | Hindi</p>

                    <div class="rating">
                        <span class="star">★</span> 8.7
                    </div>

                    <button class="btn book-btn">Book Now</button>
                </div>

            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
