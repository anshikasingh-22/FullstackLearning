<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>District - Movies</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #111111;
            background-color: #f1efff;
            min-height: 100vh;
        }
                                         
        .navbar {
            height: 62px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #e8e5f5;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .logo-small {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 3px;
        }

        .divider {
            width: 1px;
            height: 32px;
            background-color: #dddddd;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .location-icon {
            color: #6546e8;
            font-size: 20px;
        }

        .location-name {
            font-size: 15px;
            font-weight: 700;
        }

        .location-state {
            font-size: 12px;
            color: #666666;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 110px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222222;
            font-size: 13px;
            padding: 9px 17px;
            border-radius: 25px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background-color: #eee9ff;
            color: #5933d5;
        }

        .nav-links .active {
            background-color: #eee7ff;
            color: #592dcc;
            font-weight: 700;
        }

        .booking-status {
            margin-left: auto;
            padding: 10px 16px;
            background-color: #20a447;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .booking-status:hover {
            background-color: #188c3b;
        }

        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 34px 20px 80px;
        }

        .heading {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 26px;
        }

        .card-container {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .movie-card {
            width: 178px;
            background-color: #ffffff;
            border: 1px solid #dedede;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: CardAnimation 0.8s ease-in-out;
        }

        .movie-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .movie-image {
            width: 100%;
            height: 235px;
            overflow: hidden;
        }

        .movie-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .movie-card:hover .movie-image img {
            transform: scale(1.06);
        }

        .movie-info {
            padding: 11px 12px 13px;
        }

        .movie-info h3 {
            margin: 0 0 5px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-info p {
            margin: 0 0 9px;
            font-size: 12px;
            color: #555555;
        }

        .rating {
            font-size: 12px;
            color: #555555;
            margin-bottom: 10px;
        }

        .star {
            color: #df5c5c;
            font-size: 14px;
        }

        .book-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background-color: #777777;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-btn:hover {
            background-color: #555555;
        }

        @keyframes CardAnimation {
            from {
                opacity: 0;
                transform: translateX(25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 1000px) {
            .nav-links {
                margin-left: 30px;
            }

            .nav-links a {
                padding: 8px 10px;
            }
        }

        @media (max-width: 800px) {
            .navbar {
                height: auto;
                padding: 12px 15px;
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav-links {
                order: 3;
                width: 100%;
                overflow-x: auto;
                margin-left: 0;
            }

            .booking-status {
                margin-left: auto;
            }

            .main {
                padding: 25px 15px;
            }

            .card-container {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

                </div>

                <div class="movie-info">

                    <h3>Mirzapur: The Movie</h3>

                        <span class="star">★</span> 8.5
                    </div>

                    </button>

                </div>

            </div>


            <div class="movie-card">

                <div class="movie-image">

                <div class="movie-info">

                    <h3>Toxic</h3>

                    </button>

                </div>

            </div>


            <div class="movie-card">

                <div class="movie-image">

                    <img src="https://cdn.district.in/movies-assets/images/cinema/AW_Poster-18591030-9548-11f1-b29d-8985d3d6c644.jpg">

                <div class="movie-info">

        </div>

    </main>

</body>

</html>
