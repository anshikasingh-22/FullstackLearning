<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fc;
            margin: 0;
            padding: 30px;
        }

        .heading {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card-container {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .movie-card {
            width: 150px;
            border-radius: 12px;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;

            animation: CardAnimation 1s ease-in-out;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .movie-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .movie-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition: transform 0.4s ease;
        }

        .movie-card:hover .movie-image img {
            transform: scale(1.06);
        }

        .movie-info {
            padding: 10px;
        }

        .movie-info h3 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating {
            font-size: 11px;
            color: #555;
            margin-bottom: 9px;
        }

        .rating .star {
            color: #d9534f;
            font-size: 14px;
        }

        .book-btn {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;

            background-color: #777;
            color: white;

            font-size: 11px;
            cursor: pointer;

            transition: background-color 0.3s ease;
        }

        .book-btn:hover {
            background-color: #444;
        }

        @keyframes CardAnimation {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <h2 class="heading">Top Hindi Movies Near You</h2>

    <div class="card-container">

        <div class="movie-card">

            <div class="movie-image">
                <img src="https://cdn.district.in/movies-assets/images/cinema/Hanuman-Ansh-3199a900-6975-11f1-a51b-91d242246b61.jpg">
            </div>

            <div class="movie-info">
                <h3>Hanuman Ansh</h3>

                <div class="rating">
                    <span class="star">★</span>
                    9.0 | U | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>
            </div>

        </div>

        <div class="movie-card">

            <div class="movie-image">
                <img src="https://cdn.district.in/movies-assets/images/cinema/toxiv%3Dc-8340c900-9c6f-11f1-97d4-73a32236137e.jpg">
            </div>

            <div class="movie-info">
                <h3>Toxic</h3>

                <div class="rating">
                    <span class="star">★</span>
                    8.8 | U | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>
            </div>

        </div>

        <div class="movie-card">

            <div class="movie-image">
                <img src="https://cdn.district.in/movies-assets/images/cinema/_Poster-d0d78f60-961a-11f1-8483-eb84b060bac3.jpg">
            </div>

            <div class="movie-info">
                <h3>Mirzapur: The Movie</h3>

                <div class="rating">
                    <span class="star">★</span>
                    8.5 | A | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>
            </div>

        </div>

        <div class="movie-card">

            <div class="movie-image">
                <img src="https://cdn.district.in/movies-assets/images/cinema/AW_Poster-18591030-9548-11f1-b29d-8985d3d6c644.jpg">
            </div>

            <div class="movie-info">
                <h3>Awarapan 2</h3>

                <div class="rating">
                    <span class="star">★</span>
                    8.7 | U | Hindi
                </div>

                <button class="book-btn">
                    Book Now
                </button>
            </div>

        </div>

    </div>

</body>

</html>
